<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>French Flashcards</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2a85e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="French Cards" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#111}
    #root{max-width:520px;margin:0 auto;padding:1rem}
    button{cursor:pointer;font-family:inherit}
    .row{display:flex;align-items:center;gap:8px}
    .pill{border-radius:999px;border:0.5px solid #ddd;font-size:12px;font-weight:500;padding:5px 12px;background:#fff;color:#666}
    .pill.active{border:none;color:#fff}
    .panel{background:#f7f7f7;border:0.5px solid #ddd;border-radius:16px;padding:1rem;margin-bottom:.75rem}
    .panel-title{font-size:13px;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .close-btn{font-size:12px;padding:2px 10px;border-radius:999px;border:0.5px solid #ddd;background:#fff;color:#666}
    input,select{font-family:inherit;outline:none;border:0.5px solid #ddd;border-radius:8px;padding:6px 10px;font-size:12px;background:#fff;width:100%}
    .field{margin-bottom:8px}
    .field-label{font-size:12px;color:#666;margin-bottom:4px}
    .topic-btn{padding:5px 12px;border-radius:999px;font-size:12px;border:0.5px solid #ddd;background:#fff;color:#666}
    .topic-btn.active{border:none;color:#fff;font-weight:500}
    .toggle-wrap{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:.75rem}
    .toggle{width:40px;height:22px;border-radius:999px;background:#e5e5e5;position:relative;transition:background .2s;flex-shrink:0}
    .toggle.on{background:#2a85e8}
    .knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
    .toggle.on .knob{left:21px}
    .prog-bar{height:4px;border-radius:999px;background:#f0f0f0;margin-bottom:.75rem;overflow:hidden}
    .prog-fill{height:100%;border-radius:999px;transition:width .3s}
    .badge{font-size:12px;padding:3px 10px;border-radius:20px}
    .bk{background:#e6f9f0;color:#2aae6e}
    .br{background:#fff8e1;color:#e8a82a}
    .card-box{border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,.07);padding:2rem 1.5rem;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;border:0.5px solid #eee;background:#fff;user-select:none}
    .mark-btn{flex:1;padding:6px 0;font-size:18px;border-radius:12px;border:0.5px solid #ddd;background:#fff;color:#888;display:flex;align-items:center;justify-content:center}
    .mark-btn.k{background:#e6f9f0;color:#2aae6e;border-color:#2aae6e}
    .mark-btn.r{background:#fff8e1;color:#e8a82a;border-color:#e8a82a}
    .nav-btn{flex:1;padding:8px 0;font-size:18px;border-radius:12px;border:0.5px solid #ddd;background:#fff;color:#333;display:flex;align-items:center;justify-content:center}
    .topic-row-item{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:#fff;border:0.5px solid #eee;border-radius:8px;padding:4px 8px}
    .topic-row-item span{flex:1;font-size:13px}
    .icon-btn{padding:4px 8px;border-radius:8px;border:0.5px solid #ddd;background:#fff;font-size:13px}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState, useEffect, useCallback, createElement: h} = React;

const COLORS = {"All":"#2a85e8","Everyday":"#e85a2a","Months & Days":"#2aae6e","Numbers":"#9b2ae8","Classroom":"#e8a82a","Adjectives":"#e82a7a","Verbs":"#2ab8e8","Family & Home":"#e86a2a","City & Transport":"#5a8ae8","My Words":"#16a085"};

const BASE = [
  {fr:"bonjour",pr:"bohn-ZHOOR",en:"hello / good day",t:"Everyday"},
  {fr:"merci",pr:"mehr-SEE",en:"thank you",t:"Everyday"},
  {fr:"s'il vous plaît",pr:"seel voo PLEH",en:"please",t:"Everyday"},
  {fr:"au revoir",pr:"oh reh-VWAHR",en:"goodbye",t:"Everyday"},
  {fr:"oui",pr:"WEE",en:"yes",t:"Everyday"},
  {fr:"non",pr:"NOH",en:"no",t:"Everyday"},
  {fr:"l'eau",pr:"LOH",en:"water",t:"Everyday"},
  {fr:"le pain",pr:"leh PAN",en:"bread",t:"Everyday"},
  {fr:"rouge",pr:"ROOZH",en:"red",t:"Everyday"},
  {fr:"bleu",pr:"BLUH",en:"blue",t:"Everyday"},
  {fr:"grand",pr:"GRAHN",en:"big / tall",t:"Everyday"},
  {fr:"petit",pr:"peh-TEE",en:"small",t:"Everyday"},
  {fr:"aujourd'hui",pr:"oh-zhoor-DWEE",en:"today",t:"Everyday"},
  {fr:"demain",pr:"deh-MAN",en:"tomorrow",t:"Everyday"},
  {fr:"le chat",pr:"leh SHA",en:"the cat",t:"Everyday"},
  {fr:"le chien",pr:"leh SHYEN",en:"the dog",t:"Everyday"},
  {fr:"janvier",pr:"zhahn-VYEH",en:"January",t:"Months & Days"},
  {fr:"février",pr:"feh-VRYEH",en:"February",t:"Months & Days"},
  {fr:"mars",pr:"MARS",en:"March",t:"Months & Days"},
  {fr:"avril",pr:"ah-VREEL",en:"April",t:"Months & Days"},
  {fr:"mai",pr:"MEH",en:"May",t:"Months & Days"},
  {fr:"juin",pr:"ZHWAN",en:"June",t:"Months & Days"},
  {fr:"juillet",pr:"zhwee-YEH",en:"July",t:"Months & Days"},
  {fr:"août",pr:"OOT",en:"August",t:"Months & Days"},
  {fr:"septembre",pr:"sep-TAHM-breh",en:"September",t:"Months & Days"},
  {fr:"octobre",pr:"ok-TOH-breh",en:"October",t:"Months & Days"},
  {fr:"novembre",pr:"noh-VAHM-breh",en:"November",t:"Months & Days"},
  {fr:"décembre",pr:"deh-SAHM-breh",en:"December",t:"Months & Days"},
  {fr:"lundi",pr:"lun-DEE",en:"Monday",t:"Months & Days"},
  {fr:"mardi",pr:"mar-DEE",en:"Tuesday",t:"Months & Days"},
  {fr:"mercredi",pr:"mehr-kreh-DEE",en:"Wednesday",t:"Months & Days"},
  {fr:"jeudi",pr:"zhuh-DEE",en:"Thursday",t:"Months & Days"},
  {fr:"vendredi",pr:"vahn-dreh-DEE",en:"Friday",t:"Months & Days"},
  {fr:"samedi",pr:"sahm-DEE",en:"Saturday",t:"Months & Days"},
  {fr:"dimanche",pr:"dee-MAHNSH",en:"Sunday",t:"Months & Days"},
  {fr:"la semaine",pr:"lah seh-MEN",en:"the week",t:"Months & Days"},
  {fr:"le mois",pr:"leh MWAH",en:"the month",t:"Months & Days"},
  {fr:"l'année",pr:"lah-NEH",en:"the year",t:"Months & Days"},
  {fr:"le week-end",pr:"leh wee-KEND",en:"the weekend",t:"Months & Days"},
  {fr:"un",pr:"AN",en:"one (1)",t:"Numbers"},
  {fr:"deux",pr:"DUH",en:"two (2)",t:"Numbers"},
  {fr:"trois",pr:"TWAH",en:"three (3)",t:"Numbers"},
  {fr:"quatre",pr:"KAH-treh",en:"four (4)",t:"Numbers"},
  {fr:"cinq",pr:"SANK",en:"five (5)",t:"Numbers"},
  {fr:"six",pr:"SEES",en:"six (6)",t:"Numbers"},
  {fr:"sept",pr:"SET",en:"seven (7)",t:"Numbers"},
  {fr:"huit",pr:"WEET",en:"eight (8)",t:"Numbers"},
  {fr:"neuf",pr:"NUF",en:"nine (9)",t:"Numbers"},
  {fr:"dix",pr:"DEES",en:"ten (10)",t:"Numbers"},
  {fr:"onze",pr:"ONZ",en:"eleven (11)",t:"Numbers"},
  {fr:"douze",pr:"DOOZ",en:"twelve (12)",t:"Numbers"},
  {fr:"treize",pr:"TREZ",en:"thirteen (13)",t:"Numbers"},
  {fr:"quatorze",pr:"kah-TORZ",en:"fourteen (14)",t:"Numbers"},
  {fr:"quinze",pr:"KANZ",en:"fifteen (15)",t:"Numbers"},
  {fr:"seize",pr:"SEZ",en:"sixteen (16)",t:"Numbers"},
  {fr:"dix-sept",pr:"dee-SET",en:"seventeen (17)",t:"Numbers"},
  {fr:"dix-huit",pr:"dee-WEET",en:"eighteen (18)",t:"Numbers"},
  {fr:"dix-neuf",pr:"dee-NUF",en:"nineteen (19)",t:"Numbers"},
  {fr:"vingt",pr:"VAN",en:"twenty (20)",t:"Numbers"},
  {fr:"trente",pr:"TRONT",en:"thirty (30)",t:"Numbers"},
  {fr:"quarante",pr:"kah-RONT",en:"forty (40)",t:"Numbers"},
  {fr:"cinquante",pr:"san-KONT",en:"fifty (50)",t:"Numbers"},
  {fr:"soixante",pr:"swah-SONT",en:"sixty (60)",t:"Numbers"},
  {fr:"soixante-dix",pr:"swah-sont-DEES",en:"seventy (70)",t:"Numbers"},
  {fr:"quatre-vingts",pr:"kah-treh-VAN",en:"eighty (80)",t:"Numbers"},
  {fr:"quatre-vingt-dix",pr:"kah-treh-van-DEES",en:"ninety (90)",t:"Numbers"},
  {fr:"cent",pr:"SON",en:"one hundred (100)",t:"Numbers"},
  {fr:"je ne comprends pas",pr:"zheh neh kom-PRON pah",en:"I don't understand",t:"Classroom"},
  {fr:"répétez s'il vous plaît",pr:"ray-pay-TAY seel voo PLEH",en:"repeat please",t:"Classroom"},
  {fr:"l'élève",pr:"lay-LEV",en:"the student",t:"Classroom"},
  {fr:"le professeur",pr:"leh pro-feh-SUR",en:"the teacher",t:"Classroom"},
  {fr:"l'école",pr:"lay-KOL",en:"the school",t:"Classroom"},
  {fr:"le livre",pr:"leh LEE-vreh",en:"the book",t:"Classroom"},
  {fr:"manger",pr:"mahn-ZHEH",en:"to eat",t:"Verbs"},
  {fr:"parler",pr:"par-LEH",en:"to speak",t:"Verbs"},
  {fr:"aller",pr:"ah-LEH",en:"to go",t:"Verbs"},
  {fr:"avoir",pr:"ah-VWAHR",en:"to have",t:"Verbs"},
  {fr:"être",pr:"EH-treh",en:"to be",t:"Verbs"},
  {fr:"aimer",pr:"ay-MAY",en:"to like / love",t:"Verbs"},
  {fr:"écouter",pr:"ay-koo-TAY",en:"to listen",t:"Verbs"},
  {fr:"lire",pr:"LEER",en:"to read",t:"Verbs"},
  {fr:"la famille",pr:"lah fah-MEE",en:"the family",t:"Family & Home"},
  {fr:"la mère",pr:"lah MEHR",en:"the mother",t:"Family & Home"},
  {fr:"le père",pr:"leh PEHR",en:"the father",t:"Family & Home"},
  {fr:"le frère",pr:"leh FREHR",en:"the brother",t:"Family & Home"},
  {fr:"la sœur",pr:"lah SUR",en:"the sister",t:"Family & Home"},
  {fr:"la maison",pr:"lah meh-ZON",en:"the house",t:"Family & Home"},
  {fr:"la chambre",pr:"lah SHOM-breh",en:"the bedroom",t:"Family & Home"},
  {fr:"le métro",pr:"leh may-TRO",en:"the subway",t:"City & Transport"},
  {fr:"la voiture",pr:"lah vwah-TYUR",en:"the car",t:"City & Transport"},
  {fr:"la rue",pr:"lah RYU",en:"the street",t:"City & Transport"},
  {fr:"le musée",pr:"leh myoo-ZAY",en:"the museum",t:"City & Transport"},
  {fr:"la pharmacie",pr:"lah far-mah-SEE",en:"the pharmacy",t:"City & Transport"},
  {fr:"la poste",pr:"lah POST",en:"the post office",t:"City & Transport"},
];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function mkDeck(topic,skip,knownSet,cards){let f=topic==="All"?cards:cards.filter(c=>c.t===topic);if(skip)f=f.filter(c=>!knownSet.has(c.fr));return f.length>0?f:(topic==="All"?cards:cards.filter(c=>c.t===topic))}
function ls(k,def=""){try{return localStorage.getItem(k)||def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function App(){
  const [cards, setCards] = useState(()=>{
    try{const w=JSON.parse(ls("fr-custom-words","[]"));return w.length?[...BASE,...w]:BASE}catch(e){return BASE}
  });
  const [topic, setTopic] = useState("All");
  const [skip, setSkip] = useState(false);
  const [known, setKnown] = useState(()=>new Set(JSON.parse(ls("fr-known","[]"))));
  const [review, setReview] = useState(()=>new Set(JSON.parse(ls("fr-review","[]"))));
  const [deck, setDeck] = useState(()=>mkDeck("All",false,new Set(),BASE));
  const [idx, setIdx] = useState(0);
  const [flip, setFlip] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [customTopics, setCustomTopics] = useState(()=>{try{return JSON.parse(ls("fr-custom-topics","[]"))}catch(e){return[]}});

  // Panel visibility
  const [showSheet, setShowSheet] = useState(false);
  const [showAddWord, setShowAddWord] = useState(false);
  const [showTopics, setShowTopics] = useState(false);

  // Sheet state
  const [sheetUrl, setSheetUrl] = useState(ls("fr-sheet-url",""));
  const [sheetSt, setSheetSt] = useState("idle");
  const [sheetErr, setSheetErr] = useState("");

  // Add word state
  const [newFr, setNewFr] = useState("");
  const [newPr, setNewPr] = useState("");
  const [newEn, setNewEn] = useState("");
  const [newWordTopic, setNewWordTopic] = useState("Everyday");
  const [addMsg, setAddMsg] = useState("");

  // Topic manager state
  const [editT, setEditT] = useState(null);
  const [editName, setEditName] = useState("");
  const [newTopicName, setNewTopicName] = useState("");

  const allTopics = ["All",...Object.keys(COLORS).filter(k=>k!=="All"),...customTopics.filter(t=>!Object.keys(COLORS).includes(t))];
  const color = COLORS[topic]||"#2a85e8";
  const card = deck[idx];
  const isK = known.has(card.fr);
  const isR = review.has(card.fr);
  const prog = Math.round(((known.size+review.size)/deck.length)*100);

  const changeTopic = (t)=>{setTopic(t);setDeck(mkDeck(t,skip,known,cards));setIdx(0);setFlip(false)};
  const toggleSkip = ()=>{const n=!skip;setSkip(n);setDeck(mkDeck(topic,n,known,cards));setIdx(0);setFlip(false)};
  const go = (d)=>{setFlip(false);setIdx(i=>(i+d+deck.length)%deck.length)};

  const mark = (type)=>{
    const id=card.fr;
    setKnown(s=>{const n=new Set(s);type==="k"?n.add(id):n.delete(id);return n});
    setReview(s=>{const n=new Set(s);type==="r"?n.add(id):n.delete(id);return n});
  };

  const save = ()=>{
    lsSet("fr-known",JSON.stringify([...known]));
    lsSet("fr-review",JSON.stringify([...review]));
    alert("Progress saved ✓");
  };

  const reset = ()=>{
    if(!confirm("Reset all progress?")) return;
    setKnown(new Set()); setReview(new Set());
    lsSet("fr-known","[]"); lsSet("fr-review","[]");
  };

  const speak = useCallback(()=>{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(card.fr);
    u.lang="fr-FR"; u.rate=0.85;
    setSpeaking(true);
    u.onend=()=>setSpeaking(false);
    u.onerror=()=>setSpeaking(false);
    window.speechSynthesis.speak(u);
  },[card]);

  const addWord = ()=>{
    if(!newFr.trim()||!newEn.trim()){setAddMsg("⚠️ French and English are required!");return}
    const word={fr:newFr.trim(),pr:newPr.trim(),en:newEn.trim(),t:newWordTopic||"My Words"};
    const updated=[...cards,word];
    setCards(updated);
    setDeck(mkDeck(topic,skip,known,updated));
    const saved=JSON.parse(ls("fr-custom-words","[]"));
    lsSet("fr-custom-words",JSON.stringify([...saved,word]));
    setNewFr(""); setNewPr(""); setNewEn("");
    setAddMsg("✅ Word added!");
    setTimeout(()=>setAddMsg(""),2000);
  };

  const fetchSheet = async(url)=>{
    setSheetSt("loading"); setSheetErr("");
    try{
      if(!url.includes("google.com/spreadsheets")) throw new Error("Invalid URL.");
      let csvUrl=url.includes("pub?output=csv")?url:(()=>{
        const m=url.match(/\/d\/e\/([\w-]+)/)||url.match(/\/d\/([\w-]+)/);
        if(!m) throw new Error("Could not read sheet ID.");
        return url.includes("/d/e/")
          ?`https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?output=csv`
          :`https://docs.google.com/spreadsheets/d/${m[1]}/pub?output=csv`;
      })();
      let text=null;
      for(const proxy of [csvUrl,`https://api.allorigins.win/raw?url=${encodeURIComponent(csvUrl)}`,`https://corsproxy.io/?${encodeURIComponent(csvUrl)}`]){
        try{const r=await fetch(proxy);if(r.ok){text=await r.text();break}}catch(e){}
      }
      if(!text) throw new Error("Could not connect. Make sure sheet is published: File → Share → Publish to web → CSV.");
      const lines=text.trim().split("\n").slice(1);
      const newCards=lines.map(line=>{
        const cols=(line.match(/(".*?"|[^,]+)(?=,|$)/g)||[]).map(c=>c.replace(/^"|"$/g,"").trim());
        return{fr:cols[0]||"",pr:cols[1]||"",en:cols[2]||"",t:cols[3]||"My Words"};
      }).filter(c=>c.fr&&c.en);
      if(!newCards.length) throw new Error("No cards found. Check columns: French, Pronunciation, English, Topic");
      const combined=[...BASE,...newCards];
      setCards(combined); setDeck(mkDeck(topic,skip,known,combined));
      setIdx(0); setFlip(false); setSheetSt("success");
      lsSet("fr-sheet-url",url);
    }catch(e){setSheetSt("error");setSheetErr(e.message)}
  };

  const saveCustomTopics = (t)=>{setCustomTopics(t);lsSet("fr-custom-topics",JSON.stringify(t))};
  const addTopic = ()=>{const n=newTopicName.trim();if(!n)return;saveCustomTopics([...customTopics,n]);setNewTopicName("")};
  const renameTopic = (old,nw)=>{
    const tr=nw.trim();if(!tr||tr===old){setEditT(null);return}
    setCards(cs=>cs.map(c=>c.t===old?{...c,t:tr}:c));
    saveCustomTopics(customTopics.map(t=>t===old?tr:t));
    if(topic===old) setTopic(tr);
    setEditT(null);
  };
  const deleteTopic = (name)=>{
    if(!confirm(`Delete "${name}"? Cards will move to My Words.`)) return;
    const updated = cards.map(c=>c.t===name?{...c,t:"My Words"}:c);
    setCards(updated);
    setDeck(mkDeck(topic,skip,known,updated));
    const updatedCustom = customTopics.filter(t=>t!==name);
    saveCustomTopics(updatedCustom);
    if(topic===name) changeTopic("All");
  };

  const allTopics = ["All", ...Object.keys(COLORS).filter(k=>k!=="All"), ...customTopics.filter(t=>!Object.keys(COLORS).includes(t))];
  const topicList = [...Object.keys(COLORS).filter(k=>k!=="All"), ...customTopics.filter(t=>!Object.keys(COLORS).includes(t))];
  const topicDropdown = [...topicList, "My Words"].filter((v,i,a)=>a.indexOf(v)===i);

  return h("div",{id:"root"},

    // Top bar
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:".75rem",flexWrap:"wrap",gap:6}},
      h("div",{style:{fontSize:12,color:"#666"}},
        h("span",{style:{color:"#2aae6e",fontWeight:500}},known.size+" ✓"),
        " / ",h("span",{style:{color:"#e8a82a",fontWeight:500}},review.size+" ↺"),
        " / ",h("span",{style:{fontWeight:500}},cards.length+" total")
      ),
      h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
        h("button",{className:"pill"+(showAddWord?" active":""),style:showAddWord?{background:color,border:"none"}:{},onClick:()=>{setShowAddWord(p=>!p);setShowSheet(false);setShowTopics(false)}},"➕ Add Word"),
        h("button",{className:"pill",style:{background:sheetSt==="success"?"#16a08522":"#fff",color:sheetSt==="success"?"#16a085":"#666"},onClick:()=>{setShowSheet(p=>!p);setShowAddWord(false);setShowTopics(false)}},"📊 "+(sheetSt==="success"?"Connected":"Connect Sheet")),
        h("button",{className:"pill",style:{background:color,border:"none",color:"#fff"},onClick:save},"Save"),
        h("button",{className:"pill",onClick:reset},"Reset"),
      )
    ),

    // Add Word Panel
    showAddWord && h("div",{className:"panel"},
      h("div",{className:"panel-title"},
        "➕ Add New Word",
        h("button",{className:"close-btn",onClick:()=>setShowAddWord(false)},"✕ Close")
      ),
      h("div",{className:"field"},h("div",{className:"field-label"},"🇫🇷 French *"),h("input",{value:newFr,onChange:e=>setNewFr(e.target.value),placeholder:"e.g. la mer"})),
      h("div",{className:"field"},h("div",{className:"field-label"},"🔊 Pronunciation (optional)"),h("input",{value:newPr,onChange:e=>setNewPr(e.target.value),placeholder:"e.g. lah MEHR"})),
      h("div",{className:"field"},h("div",{className:"field-label"},"🇬🇧 English *"),h("input",{value:newEn,onChange:e=>setNewEn(e.target.value),placeholder:"e.g. the sea"})),
      h("div",{className:"field"},
        h("div",{className:"field-label"},"📁 Topic"),
        h("select",{value:newWordTopic,onChange:e=>setNewWordTopic(e.target.value)},
          topicDropdown.map(t=>h("option",{key:t,value:t},t))
        )
      ),
      h("button",{onClick:addWord,style:{width:"100%",padding:"10px",borderRadius:12,border:"none",background:color,color:"#fff",fontSize:14,fontWeight:500}},"➕ Add Card"),
      addMsg && h("div",{style:{marginTop:8,fontSize:13,textAlign:"center",color:addMsg.includes("✅")?"#2aae6e":"#e85a2a"}},addMsg)
    ),

    // Sheet Panel
    showSheet && h("div",{className:"panel"},
      h("div",{className:"panel-title"},
        "📊 Connect Google Sheet",
        h("button",{className:"close-btn",onClick:()=>setShowSheet(false)},"✕ Close")
      ),
      h("p",{style:{fontSize:12,color:"#666",lineHeight:1.7,marginBottom:10}},
        "1. Create sheet: French | Pronunciation | English | Topic",h("br"),
        "2. File → Share → Publish to web → CSV → Publish",h("br"),
        "3. Paste the published link below"
      ),
      h("div",{style:{display:"flex",gap:8}},
        h("input",{value:sheetUrl,onChange:e=>setSheetUrl(e.target.value),placeholder:"https://docs.google.com/spreadsheets/d/...",style:{flex:1}}),
        h("button",{onClick:()=>fetchSheet(sheetUrl),disabled:!sheetUrl||sheetSt==="loading",style:{padding:"6px 14px",borderRadius:8,border:"none",background:color,color:"#fff",fontWeight:500,opacity:!sheetUrl||sheetSt==="loading"?0.5:1}},sheetSt==="loading"?"Loading...":"Load")
      ),
      sheetSt==="success"&&h("div",{style:{fontSize:12,color:"#16a085",marginTop:8}},"✅ Sheet loaded!"),
      sheetSt==="error"&&h("div",{style:{fontSize:12,color:"#e85a2a",marginTop:8}},"⚠️ "+sheetErr),
    ),

    // Topic header
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}},
      h("div",{style:{fontSize:12,color:"#666"}},"topic"),
      h("button",{className:"pill"+(showTopics?" active":""),style:showTopics?{background:color,border:"none",color:"#fff"}:{},onClick:()=>{setShowTopics(p=>!p);setShowAddWord(false);setShowSheet(false)}},"⚙️ Manage Topics")
    ),

    // Topic pills — show ALL topics including custom ones
    h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:".75rem"}},
      allTopics.map(t=>
        h("button",{key:t,className:"topic-btn"+(topic===t?" active":""),style:topic===t?{background:COLORS[t]||"#2a85e8"}:{},onClick:()=>changeTopic(t)},t)
      )
    ),

    // Topic Manager Panel
    showTopics && h("div",{className:"panel"},
      h("div",{className:"panel-title"},
        "⚙️ Manage Topics",
        h("button",{className:"close-btn",onClick:()=>setShowTopics(false)},"✕ Close")
      ),
      topicList.map(t=>
        h("div",{key:t,className:"topic-row-item"},
          editT===t
            ? h(React.Fragment,null,
                h("input",{value:editName,onChange:e=>setEditName(e.target.value),onKeyDown:e=>e.key==="Enter"&&renameTopic(t,editName),autoFocus:true,style:{flex:1}}),
                h("button",{onClick:()=>renameTopic(t,editName),style:{padding:"4px 10px",borderRadius:8,border:"none",background:color,color:"#fff"}},"✓"),
                h("button",{onClick:()=>setEditT(null),style:{padding:"4px 10px",borderRadius:8,border:"0.5px solid #ddd",background:"#fff",color:"#666"}},"✕")
              )
            : h(React.Fragment,null,
                h("span",null,t),
                h("button",{className:"icon-btn",onClick:()=>{setEditT(t);setEditName(t)}},"✏️"),
                h("button",{className:"icon-btn",style:{color:"#e85a2a"},onClick:()=>deleteTopic(t)},"🗑️")
              )
        )
      ),
      h("div",{style:{display:"flex",gap:8,marginTop:10}},
        h("input",{value:newTopicName,onChange:e=>setNewTopicName(e.target.value),onKeyDown:e=>e.key==="Enter"&&addTopic(),placeholder:"New topic name...",style:{flex:1}}),
        h("button",{onClick:addTopic,disabled:!newTopicName.trim(),style:{padding:"6px 14px",borderRadius:8,border:"none",background:color,color:"#fff",opacity:newTopicName.trim()?1:0.5}},"➕ Add")
      )
    ),

    // Skip toggle
    h("div",{className:"toggle-wrap",onClick:toggleSkip},
      h("div",{className:"toggle"+(skip?" on":""),style:skip?{background:color}:{}},h("div",{className:"knob"})),
      h("span",{style:{fontSize:13,color:"#666"}},
        "Skip words I know",
        skip&&h("span",{style:{color,fontWeight:500,marginLeft:6}},"("+deck.length+" remaining)")
      )
    ),

    // Card counter
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:".5rem"}},
      h("span",{style:{fontSize:13,color:"#666"}},"Card "+(idx+1)+" of "+deck.length),
      h("div",{style:{display:"flex",gap:8}},
        h("span",{className:"badge bk"},known.size+" ✓"),
        h("span",{className:"badge br"},review.size+" ↺")
      )
    ),

    // Progress bar
    h("div",{className:"prog-bar"},h("div",{className:"prog-fill",style:{width:prog+"%",background:color}})),

    // Card
    h("div",{className:"card-box",style:{border:`0.5px solid ${isK?"#2aae6e":isR?"#e8a82a":"#eee"}`},onClick:()=>setFlip(f=>!f)},
      h("span",{style:{position:"absolute",top:10,left:14,fontSize:11,padding:"2px 8px",borderRadius:999,background:(COLORS[card.t]||"#2a85e8")+"22",color:COLORS[card.t]||"#2a85e8"}},card.t),
      h("span",{style:{position:"absolute",top:14,right:16,fontSize:11,color:"#aaa"}},flip?"meaning":"tap to reveal"),
      !flip
        ? h(React.Fragment,null,
            h("div",{style:{fontSize:36,fontWeight:500,textAlign:"center",lineHeight:1.2}},card.fr),
            h("div",{style:{fontSize:14,color:"#888",fontStyle:"italic"}},card.pr)
          )
        : h(React.Fragment,null,
            h("div",{style:{fontSize:14,color:"#888"}},card.fr),
            h("div",{style:{fontSize:30,fontWeight:500,textAlign:"center",lineHeight:1.2}},card.en)
          )
    ),

    // Speaker
    h("div",{style:{display:"flex",justifyContent:"center",marginTop:14}},
      h("button",{onClick:speak,style:{padding:"8px 24px",borderRadius:999,border:"none",background:speaking?"#c46a1a":"#e8852a",color:"#fff",fontSize:20,transform:speaking?"scale(0.95)":"scale(1)"}},"🔊")
    ),

    // Mark buttons
    h("div",{style:{display:"flex",gap:10,marginTop:12}},
      h("button",{className:"mark-btn"+(isK?" k":""),onClick:()=>mark(isK?null:"k")},"✓"),
      h("button",{className:"mark-btn"+(isR?" r":""),onClick:()=>mark(isR?null:"r")},"↺")
    ),

    // Nav
    h("div",{style:{display:"flex",gap:10,marginTop:10}},
      h("button",{className:"nav-btn",onClick:()=>go(-1)},"←"),
      h("button",{style:{padding:"8px 20px",fontSize:18,borderRadius:12,border:"0.5px solid #ddd",background:"#fff",color:"#888"},onClick:()=>{setDeck(d=>shuffle(d));setIdx(0);setFlip(false)}},"⇄"),
      h("button",{className:"nav-btn",onClick:()=>go(1)},"→")
    )
  );
}

ReactDOM.render(h(App),document.getElementById("root"));
</script>
</body>
</html>
