<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2ab8c8;--green:#2aae6e;--orange:#4a3728;--red:#e85a2a}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2e8d9;color:#2a1e12;min-height:100vh;padding-bottom:2rem}
button{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
input,select{font-family:inherit}
.header{background:#ede0cc;padding:12px 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 #d4c0a0}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.app-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.header-stats{display:flex;gap:8px;font-size:12px}
.stat-pill{padding:3px 10px;border-radius:99px;font-weight:600}
.stat-due{background:#e8d5b0;color:#4a3728}
.stat-known{background:#e6f9f0;color:#2aae6e}
.topics-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.topics-scroll::-webkit-scrollbar{display:none}
.tp{font-size:13px;padding:6px 14px;border-radius:99px;border:1.5px solid #ddd;background:#fff;color:#666;white-space:nowrap;font-weight:500;flex-shrink:0;transition:all .15s}
.tp.on{border-color:transparent;color:#fff}
.main{padding:16px}
.mode-bar{display:flex;gap:6px;margin-bottom:14px;background:#fff;border-radius:12px;padding:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.mode-btn{flex:1;font-size:12px;font-weight:600;padding:7px 4px;border-radius:9px;border:none;background:transparent;color:#999;transition:all .15s;text-align:center}
.mode-btn.on{background:#2ab8c8;color:#fff;box-shadow:0 2px 8px rgba(42,184,200,.3)}
.card{border-radius:24px;box-shadow:0 6px 30px rgba(0,0,0,.08);min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;position:relative;background:#fff;user-select:none;padding:2rem 1.5rem;border:1.5px solid #eee;transition:transform .08s;margin-bottom:14px}
.card:active{transform:scale(.98)}
.card-tag{position:absolute;top:14px;left:16px;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600;color:#fff}
.card-hint{position:absolute;top:16px;right:16px;font-size:11px;color:#e8852a;font-weight:600}
.fr-text{font-size:48px;font-weight:600;text-align:center;line-height:1.15;letter-spacing:-.5px}
.pr-text{font-size:15px;color:#aaa;font-style:italic;text-align:center}
.en-text{font-size:32px;font-weight:500;text-align:center;line-height:1.2;color:#333}
.en-small{font-size:15px;color:#bbb;text-align:center}
.flip-hint{font-size:13px;color:#ccc;margin-top:4px}
.speak-row{display:flex;justify-content:center;margin-bottom:12px}
.speak-btn{padding:10px 32px;border-radius:99px;border:none;background:#e8855a;color:#fff;font-size:24px;transition:transform .1s,background .15s;box-shadow:0 2px 8px rgba(232,133,90,.4)}
.speak-btn:active{background:#d06840;transform:scale(.93)}
.sm2-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.sm2-btn{padding:12px 4px;border-radius:14px;border:none;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
.sm2-btn:active{transform:scale(.94)}
.sm2-btn .interval{font-size:10px;font-weight:400;opacity:.75;margin-top:2px}
.btn-again{background:#ffe5e5;color:#e85a2a}
.btn-hard{background:#fff3e0;color:#e8852a}
.btn-good{background:#e6f9f0;color:#2aae6e}
.btn-easy{background:#e8f0ff;color:#2a85e8}
.nav-row{display:flex;gap:8px;margin-bottom:14px}
.nav-btn{flex:1;padding:12px;border-radius:14px;border:1.5px solid #eee;background:#fff;font-size:20px;color:#555;font-weight:600;transition:all .1s}
.nav-btn:active{background:#f0f0f0}
.shuf-btn{padding:12px 18px;border-radius:14px;border:1.5px solid #eee;background:#fff;font-size:20px;color:#aaa}
.prog-wrap{margin-bottom:14px}
.prog-labels{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:4px}
.prog{height:5px;border-radius:99px;background:#eee;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .4s}
.quick-add{background:#fff;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:14px;margin-bottom:14px;border:1.5px solid #eee}
.qa-title{font-size:13px;font-weight:700;color:#555;margin-bottom:10px}
.qa-row{display:flex;gap:6px}
.qa-input{flex:1;font-size:15px;padding:10px 12px;border:1.5px solid #eee;border-radius:12px;outline:none;background:#f8f8f8;transition:border .15s}
.qa-input:focus{border-color:#2ab8c8;background:#fff}
.qa-select{font-size:13px;padding:10px 8px;border:1.5px solid #eee;border-radius:12px;outline:none;background:#f8f8f8;color:#555;max-width:130px}
.qa-add-btn{padding:10px 18px;border-radius:12px;border:none;background:#2ab8c8;color:#fff;font-size:18px;font-weight:700;transition:transform .1s}
.qa-add-btn:active{transform:scale(.93)}
.qa-msg{font-size:12px;text-align:center;margin-top:6px;font-weight:500}
.box{background:#fff;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:14px;margin-bottom:14px;border:1.5px solid #eee}
.box-title{font-size:13px;font-weight:700;color:#555;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.box-toggle{font-size:12px;color:var(--blue);font-weight:600;background:none;border:none;padding:0}
.row-list{display:flex;flex-direction:column;gap:6px}
.mw-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid #eee;border-radius:12px;background:#f8f8f8}
.mw-fr{font-size:14px;font-weight:600;flex:1}
.mw-en{font-size:13px;color:#888;flex:1}
.mw-del{background:none;border:none;font-size:16px;color:#ddd;padding:2px 6px;border-radius:8px}
.mw-del:active{color:#e85a2a}
.empty{text-align:center;padding:16px;color:#bbb;font-size:13px}
.sec-label{font-size:11px;color:#aaa;margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.edit-btn{padding:3px 10px;border-radius:8px;border:1.5px solid #eee;background:#fff;color:#888;font-size:12px}
.save-btn{padding:4px 10px;border-radius:8px;border:none;background:#2aae6e;color:#fff;font-weight:700;font-size:13px}
.cancel-btn{padding:4px 10px;border-radius:8px;border:1.5px solid #eee;background:#fff;color:#aaa;font-size:13px}
.restore-pill{font-size:12px;padding:4px 12px;border-radius:99px;font-weight:600;background:#f0f0f0;color:#aaa;border:1.5px dashed #ddd;cursor:pointer}
.quiz-card{border-radius:24px;box-shadow:0 6px 30px rgba(0,0,0,.08);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;padding:2rem 1.5rem;margin-bottom:14px;border:1.5px solid #eee}
.quiz-prompt{font-size:22px;font-weight:700;text-align:center}
.quiz-sub{font-size:14px;color:#aaa;text-align:center}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mc-btn{padding:14px 10px;border-radius:16px;border:1.5px solid #eee;background:#fff;font-size:15px;font-weight:600;color:#333;text-align:center;transition:all .15s;line-height:1.3}
.mc-btn:active{transform:scale(.97)}
.mc-btn.correct{background:#e6f9f0;border-color:#2aae6e;color:#2aae6e}
.mc-btn.wrong{background:#ffe5e5;border-color:#e85a2a;color:#e85a2a}
.quiz-score{display:flex;gap:10px;justify-content:center;font-size:13px;font-weight:600;margin-bottom:10px}
.qs-right{color:#2aae6e}.qs-wrong{color:#e85a2a}
.quiz-next{width:100%;padding:14px;border-radius:14px;border:none;background:#2ab8c8;color:#fff;font-size:16px;font-weight:700;margin-bottom:10px}
.listen-icon{font-size:64px;cursor:pointer;transition:transform .1s}
.listen-icon:active{transform:scale(.93)}
.play-again{padding:6px 18px;border:1.5px solid #eee;border-radius:99px;background:#fff;font-size:13px;color:#999}

const getColor=(t,customTopics)=>{
  if(BUILTIN_COLORS[t])return BUILTIN_COLORS[t];
  const i=customTopics.indexOf(t);
  return CUSTOM_COLORS[i%CUSTOM_COLORS.length]||"#2a85e8";
};

const ls=(k,d)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d}catch{return d}};
const lsSave=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const today=()=>Math.floor(Date.now()/86400000);
const initSR=()=>({ease:2.5,interval:0,rep:0,due:today()});
const applySM2=(sr,q)=>{
  let{ease,interval,rep}=sr;
  if(q===0){rep=0;interval=1;}
  else if(q===1){interval=Math.max(1,Math.round(interval*1.2));ease=Math.max(1.3,ease-.15);}
  else if(q===2){if(rep===0)interval=1;else if(rep===1)interval=6;else interval=Math.round(interval*ease);rep++;ease=Math.max(1.3,ease);}
  else{if(rep===0)interval=4;else if(rep===1)interval=10;else interval=Math.round(interval*ease*1.3);rep++;ease=Math.min(3.5,ease+.15);}
  return{ease,interval,rep,due:today()+interval};
};
const ivLabel=(sr,q)=>{const d=applySM2(sr,q).interval;if(d<=1)return"<1d";if(d<7)return d+"d";if(d<30)return Math.round(d/7)+"w";return Math.round(d/30)+"mo";};
const speakFr=t=>{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.85;window.speechSynthesis.speak(u);},50);};

// ── Topic Manager ──
function TopicManager({customTopics,setCustomTopics,hiddenBuiltIn,setHiddenBuiltIn,customWords,setCustomWords,activeTopic,setActiveTopic,gc}){
  const [open,setOpen]=useState(false);
  const [newName,setNewName]=useState("");
  const [editIdx,setEditIdx]=useState(null);
  const [editVal,setEditVal]=useState("");
  const [msg,setMsg]=useState(null);
  const flash=(text,ok=true)=>{setMsg({text,ok});setTimeout(()=>setMsg(null),2200);};

  const builtinNames=Object.keys(BUILTIN_COLORS);
  const activeBuiltin=builtinNames.filter(t=>!hiddenBuiltIn.includes(t));
  const removedBuiltin=builtinNames.filter(t=>hiddenBuiltIn.includes(t));

  const addTopic=()=>{
    const n=newName.trim();
    if(!n)return flash("⚠️ Enter a name",false);
    if(customTopics.includes(n)||BUILTIN_COLORS[n])return flash("⚠️ Already exists",false);
    setCustomTopics(p=>[...p,n]);
    setNewName("");
    flash("✅ \""+n+"\" added");
  };
  const startEdit=i=>{setEditIdx(i);setEditVal(customTopics[i]);};
  const saveEdit=i=>{
    const n=editVal.trim(),old=customTopics[i];
    if(!n||n===old){setEditIdx(null);return;}
    if(customTopics.includes(n)||BUILTIN_COLORS[n])return flash("⚠️ Name taken",false);
    setCustomWords(w=>w.map(c=>c.t===old?{...c,t:n}:c));
    setCustomTopics(p=>p.map((v,j)=>j===i?n:v));
    if(activeTopic===old)setActiveTopic(n);
    setEditIdx(null);flash("✅ Renamed");
  };
  const deleteCustom=i=>{
    const name=customTopics[i];
    const cnt=customWords.filter(c=>c.t===name).length;
    setCustomWords(w=>w.map(c=>c.t===name?{...c,t:"My Words"}:c));
    setCustomTopics(p=>p.filter((_,j)=>j!==i));
    if(activeTopic===name)setActiveTopic("All");
    flash("🗑 \""+name+"\""+(cnt?" · "+cnt+" card"+(cnt>1?"s":"")+" → My Words":"")+" deleted");
  };
  const deleteBuiltin=t=>{
    setHiddenBuiltIn(p=>[...p,t]);
    if(activeTopic===t)setActiveTopic("All");
    const cnt=BASE.filter(c=>c.t===t).length;
    flash("🗑 \""+t+"\" · "+cnt+" card"+(cnt>1?"s":"")+" → My Words");
  };
  const restoreBuiltin=t=>{setHiddenBuiltIn(p=>p.filter(x=>x!==t));flash("✅ \""+t+"\" restored");};

  return h("div",{className:"box"},
    h("div",{className:"box-title"},
      "🗂 Topics",
      h("button",{className:"box-toggle",onClick:()=>setOpen(s=>!s)},open?"Hide":"Manage")
    ),
    open&&h(Fragment,null,
      h("div",{className:"sec-label",style:{marginBottom:8}},"Built-in"),
      h("div",{className:"row-list",style:{marginBottom:12}},
        activeBuiltin.map(t=>h("div",{key:t,className:"mw-row"},
          h("div",{className:"dot",style:{background:gc(t)}}),
          h("span",{className:"mw-fr",style:{fontWeight:500}},t),
          h("span",{style:{fontSize:11,color:"#ccc"}},BASE.filter(c=>c.t===t).length+" cards"),
          h("button",{className:"mw-del",onClick:()=>deleteBuiltin(t)},"🗑")
        ))
      ),
      removedBuiltin.length>0&&h(Fragment,null,
        h("div",{className:"sec-label",style:{marginBottom:6}},"Removed — tap to restore"),
        h("div",{style:{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}},
          removedBuiltin.map(t=>h("button",{key:t,className:"restore-pill",onClick:()=>restoreBuiltin(t)},"↩ "+t))
        )
      ),
      h("div",{className:"sec-label",style:{marginBottom:8}},"My Topics"),
      customTopics.length===0
        ?h("div",{className:"empty",style:{padding:"8px 0"}},"No custom topics yet")
        :h("div",{className:"row-list",style:{marginBottom:10}},
          customTopics.map((t,i)=>h("div",{key:t,className:"mw-row"},
            editIdx===i
              ?h(Fragment,null,
                h("input",{className:"qa-input",autoFocus:true,style:{fontSize:14,padding:"4px 8px",flex:1},
                  value:editVal,onChange:e=>setEditVal(e.target.value),
                  onKeyDown:e=>{if(e.key==="Enter")saveEdit(i);if(e.key==="Escape")setEditIdx(null);}}),
                h("button",{className:"save-btn",onClick:()=>saveEdit(i)},"✓"),
                h("button",{className:"cancel-btn",onClick:()=>setEditIdx(null)},"✕")
              )
              :h(Fragment,null,
                h("div",{className:"dot",style:{background:gc(t)}}),
                h("span",{className:"mw-fr",style:{fontWeight:500}},t),
                h("span",{style:{fontSize:11,color:"#ccc"}},customWords.filter(c=>c.t===t).length+" words"),
                h("button",{className:"edit-btn",onClick:()=>startEdit(i)},"✏️"),
                h("button",{className:"mw-del",onClick:()=>deleteCustom(i)},"🗑")
              )
          ))
        ),
      h("div",{className:"qa-row",style:{marginTop:4}},
        h("input",{className:"qa-input",placeholder:"New topic name…",value:newName,
          onChange:e=>setNewName(e.target.value),onKeyDown:e=>{if(e.key==="Enter")addTopic();}}),
        h("button",{className:"qa-add-btn",onClick:addTopic},"➕")
      ),
      msg&&h("div",{className:"qa-msg",style:{color:msg.ok?"#2aae6e":"#e85a2a",marginTop:6}},msg.text)
    )
  );
}

// ── Main App ──
function App(){
  // ── all state declared first ──
  const [customWords,setCustomWords]=useState(()=>ls("fr2-words",[]));
  const [customTopics,setCustomTopics]=useState(()=>ls("fr2-custom-topics",[]));
  const [hiddenBuiltIn,setHiddenBuiltIn]=useState(()=>ls("fr2-hidden-builtin",[]));
  const [srMap,setSrMap]=useState(()=>ls("fr2-sr",{}));
  const [topic,setTopic]=useState("All");
  const [mode,setMode]=useState("flash");
  const [deck,setDeck]=useState([]);
  const [idx,setIdx]=useState(0);
  const [flipped,setFlipped]=useState(false);
  const [showMyWords,setShowMyWords]=useState(false);
  const [qaFr,setQaFr]=useState("");
  const [qaPr,setQaPr]=useState("");
  const [qaEn,setQaEn]=useState("");
  const [qaT,setQaT]=useState("My Words");
  const [qaMsg,setQaMsg]=useState("");
  const [choices,setChoices]=useState([]);
  const [chosen,setChosen]=useState(null);
  const [qScore,setQScore]=useState({r:0,w:0});
  const [listenRevealed,setListenRevealed]=useState(false);

  // ── derived data ──
  const gc=t=>getColor(t,customTopics);

  // treat hidden built-in cards as My Words
  const allCards=[...BASE,...customWords].map(c=>
    hiddenBuiltIn.includes(c.t)&&BUILTIN_COLORS[c.t]?{...c,t:"My Words"}:c
  );

  // active topic pills: built-ins not hidden + custom topics with cards + My Words if populated
  const topicPills=["All",...Object.keys(BUILTIN_COLORS)
    .filter(t=>!hiddenBuiltIn.includes(t)&&allCards.some(c=>c.t===t)),
    ...customTopics.filter(t=>allCards.some(c=>c.t===t))
  ];

  // dropdown topics for add-word
  const dropdownTopics=[
    ...Object.keys(BUILTIN_COLORS).filter(t=>!hiddenBuiltIn.includes(t)),
    ...customTopics
  ];

  const getSR=fr=>srMap[fr]||initSR();
  const dueCount=allCards.filter(c=>getSR(c.fr).due<=today()).length;

  const buildDeck=useCallback((t,ac)=>{
    let pool=t==="All"?[...ac]:ac.filter(c=>c.t===t);
    const due=shuf(pool.filter(c=>getSR(c.fr).due<=today()));
    const rest=shuf(pool.filter(c=>getSR(c.fr).due>today()));
    return[...due,...rest];
  },[srMap]);

  // rebuild deck when topic/cards/hidden change
  useEffect(()=>{
    const d=buildDeck(topic,allCards);
    setDeck(d);setIdx(0);setFlipped(false);setChosen(null);setListenRevealed(false);
  },[topic,customWords,hiddenBuiltIn,customTopics]);

  // persist
  useEffect(()=>lsSave("fr2-words",customWords),[customWords]);
  useEffect(()=>lsSave("fr2-custom-topics",customTopics),[customTopics]);
  useEffect(()=>lsSave("fr2-hidden-builtin",hiddenBuiltIn),[hiddenBuiltIn]);
  useEffect(()=>lsSave("fr2-sr",srMap),[srMap]);

  const card=deck[idx];
  const sr=card?getSR(card.fr):initSR();
  const color=card?gc(card.t):"#2a85e8";
  const topicColor=gc(topic);
  const prog=deck.length?Math.round(idx/deck.length*100):0;
  const isDue=card&&getSR(card.fr).due<=today();

  const reset=()=>{setFlipped(false);setChosen(null);setListenRevealed(false);};
  const next=()=>{reset();setIdx(i=>(i+1)%deck.length);};
  const prev=()=>{reset();setIdx(i=>(i-1+deck.length)%deck.length);};
  const reshuffle=()=>{const d=buildDeck(topic,allCards);setDeck(d);setIdx(0);reset();};

  const rate=q=>{
    if(!card)return;
    setSrMap(m=>({...m,[card.fr]:applySM2(getSR(card.fr),q)}));
    next();
  };

  const makeChoices=useCallback((card,pool,field)=>{
    if(!card||pool.length<2)return[];
    return shuf([card[field],...shuf(pool.filter(c=>c.fr!==card.fr)).slice(0,3).map(c=>c[field])]);
  },[]);

  useEffect(()=>{
    if(!card)return;
    if(mode==="mc-fe"||mode==="mc-ef"){
      const pool=(topic==="All"?allCards:allCards.filter(c=>c.t===topic));
      setChoices(makeChoices(card,pool,mode==="mc-fe"?"en":"fr"));
    }
    setChosen(null);setListenRevealed(false);
  },[idx,mode,card]);

  const pickChoice=c=>{
    if(chosen!==null)return;
    setChosen(c);
    const correct=mode==="mc-fe"?card.en:card.fr;
    setQScore(s=>c===correct?{...s,r:s.r+1}:{...s,w:s.w+1});
  };

  const addWord=()=>{
    if(!qaFr.trim()||!qaEn.trim()){setQaMsg("⚠️ French & English required");setTimeout(()=>setQaMsg(""),2000);return;}
    const w={fr:qaFr.trim(),pr:qaPr.trim(),en:qaEn.trim(),t:qaT||"My Words"};
    setCustomWords(p=>[...p,w]);
    setQaFr("");setQaPr("");setQaEn("");
    setQaMsg("✅ Added!");setTimeout(()=>setQaMsg(""),2000);
  };
  const delWord=fr=>setCustomWords(p=>p.filter(w=>w.fr!==fr));

  if(!card)return h("div",{style:{padding:40,textAlign:"center",color:"#aaa"}},"No cards in this topic.");

  return h(Fragment,null,
    // HEADER
    h("div",{className:"header"},
      h("div",{className:"header-top"},
        h("div",{className:"app-title"},"🇫🇷 French Cards"),
        h("div",{className:"header-stats"},
          dueCount>0&&h("div",{className:"stat-pill stat-due"},dueCount+" due"),
          h("div",{className:"stat-pill stat-known"},allCards.length+" cards")
        )
      ),
      h("div",{className:"topics-scroll"},
        topicPills.map(t=>h("button",{key:t,className:"tp"+(topic===t?" on":""),
          style:topic===t?{background:gc(t)}:{},onClick:()=>setTopic(t)},t))
      )
    ),

    h("div",{className:"main"},
      // MODE BAR
      h("div",{className:"mode-bar"},
        [["flash","🃏 Flash"],["mc-fe","FR→EN"],["mc-ef","EN→FR"],["listen","🎧 Listen"]].map(([m,l])=>
          h("button",{key:m,className:"mode-btn"+(mode===m?" on":""),onClick:()=>{setMode(m);setQScore({r:0,w:0})}},l)
        )
      ),

      // PROGRESS
      h("div",{className:"prog-wrap"},
        h("div",{className:"prog-labels"},h("span",null,(idx+1)+" / "+deck.length),h("span",{style:{color:topicColor}},prog+"%")),
        h("div",{className:"prog"},h("div",{className:"prog-fill",style:{width:prog+"%",background:topicColor}}))
      ),

      // ── FLASHCARD ──
      mode==="flash"&&h(Fragment,null,
        h("div",{className:"card",onClick:()=>setFlipped(f=>!f)},
          h("div",{className:"card-tag",style:{background:color}},card.t),
          isDue&&h("div",{className:"card-hint"},"due"),
          !flipped&&h(Fragment,null,
            h("div",{className:"fr-text"},card.fr),
            card.pr&&h("div",{className:"pr-text"},card.pr),

          ),
          flipped&&h(Fragment,null,
            h("div",{className:"en-small"},card.fr),
            h("div",{className:"en-text"},card.en)
          )
        ),
        h("div",{className:"speak-row"},h("button",{className:"speak-btn",onClick:e=>{e.stopPropagation();speakFr(card.fr);}},"🔊")),
        flipped
          ?h("div",{className:"sm2-row"},
            [["Again","btn-again",0],["Hard","btn-hard",1],["Good","btn-good",2],["Easy","btn-easy",3]].map(([l,cls,q])=>
              h("button",{key:q,className:"sm2-btn "+cls,onClick:()=>rate(q)},l,h("span",{className:"interval"},ivLabel(sr,q)))
            )
          )
          :h("div",{className:"nav-row"},
            h("button",{className:"nav-btn",onClick:prev},"←"),
            h("button",{className:"nav-btn",onClick:next},"→"),
            h("button",{className:"shuf-btn",onClick:reshuffle},"⇌")
          )
      ),

      // ── MULTIPLE CHOICE ──
      (mode==="mc-fe"||mode==="mc-ef")&&h(Fragment,null,
        h("div",{className:"quiz-card"},
          h("div",{className:"quiz-sub"},mode==="mc-fe"?"What does this mean?":"How do you say..."),
          h("div",{className:"quiz-prompt"},mode==="mc-fe"?card.fr:card.en),
          mode==="mc-fe"&&card.pr&&h("div",{className:"pr-text"},card.pr),
          mode==="mc-fe"&&h("button",{className:"speak-btn",style:{padding:"8px 20px",fontSize:18},onClick:()=>speakFr(card.fr)},"🔊")
        ),
        h("div",{className:"quiz-score"},h("span",{className:"qs-right"},"✓ "+qScore.r),h("span",{className:"qs-wrong"},"✗ "+qScore.w)),
        h("div",{className:"mc-grid"},
          choices.map((c,i)=>{
            const correct=mode==="mc-fe"?card.en:card.fr;
            let cls="mc-btn";
            if(chosen!==null){if(c===correct)cls+=" correct";else if(c===chosen)cls+=" wrong";}
            return h("button",{key:i,className:cls,onClick:()=>pickChoice(c)},c);
          })
        ),
        chosen!==null&&h("button",{className:"quiz-next",onClick:next},"Next →")
      ),

      // ── LISTEN ──
      mode==="listen"&&h(Fragment,null,
        h("div",{className:"quiz-card"},
          h("div",{className:"quiz-sub"},"Listen and pick the French word"),
          h("div",{className:"listen-icon",onClick:()=>speakFr(card.fr)},"🔊"),
          h("button",{className:"play-again",onClick:()=>speakFr(card.fr)},"Play again")
        ),
        h("div",{className:"quiz-score"},h("span",{className:"qs-right"},"✓ "+qScore.r),h("span",{className:"qs-wrong"},"✗ "+qScore.w)),
        h("div",{className:"mc-grid"},
          (()=>{
            const pool=topic==="All"?allCards:allCards.filter(c=>c.t===topic);
            return makeChoices(card,pool,"fr").map((c,i)=>{
              let cls="mc-btn";
              if(listenRevealed){if(c===card.fr)cls+=" correct";else if(c===chosen)cls+=" wrong";}
              return h("button",{key:i,className:cls,onClick:()=>{
                if(listenRevealed)return;
                setChosen(c);setListenRevealed(true);
                setQScore(s=>c===card.fr?{...s,r:s.r+1}:{...s,w:s.w+1});
              }},c);
            });
          })()
        ),
        listenRevealed&&h("button",{className:"quiz-next",onClick:next},"Next →")
      ),

      // QUICK ADD
      h("div",{className:"quick-add"},
        h("div",{className:"qa-title"},"➕ Add a word"),
        h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
          h("div",{className:"qa-row"},
            h("input",{className:"qa-input",style:{fontSize:16,fontWeight:500},placeholder:"🇫🇷 French *",value:qaFr,
              onChange:e=>setQaFr(e.target.value),onKeyDown:e=>{if(e.key==="Enter")addWord();}}),
            h("input",{className:"qa-input",placeholder:"🔊 Pronunciation",value:qaPr,
              onChange:e=>setQaPr(e.target.value),onKeyDown:e=>{if(e.key==="Enter")addWord();},style:{maxWidth:140}})
          ),
          h("div",{className:"qa-row"},
            h("input",{className:"qa-input",placeholder:"🇬🇧 English *",value:qaEn,
              onChange:e=>setQaEn(e.target.value),onKeyDown:e=>{if(e.key==="Enter")addWord();}}),
            h("select",{className:"qa-select",value:qaT,onChange:e=>setQaT(e.target.value)},
              dropdownTopics.map(t=>h("option",{key:t,value:t},t))
            ),
            h("button",{className:"qa-add-btn",onClick:addWord},"➕")
          )
        ),
        qaMsg&&h("div",{className:"qa-msg",style:{color:qaMsg.includes("✅")?"#2aae6e":"#e85a2a"}},qaMsg)
      ),

      // MY WORDS
      customWords.length>0&&h("div",{className:"box"},
        h("div",{className:"box-title"},
          "📝 My Words ("+customWords.length+")",
          h("button",{className:"box-toggle",onClick:()=>setShowMyWords(s=>!s)},showMyWords?"Hide":"Show")
        ),
        showMyWords&&h("div",{className:"row-list"},
          customWords.map((w,i)=>h("div",{key:i,className:"mw-row"},
            h("span",{className:"mw-fr"},w.fr),
            h("span",{className:"mw-en"},w.en),
            h("span",{style:{fontSize:11,color:"#ccc",marginRight:4}},w.t),
            h("button",{className:"mw-del",onClick:()=>delWord(w.fr)},"🗑")
          ))
        )
      ),

      // TOPIC MANAGER
      h(TopicManager,{
        customTopics,setCustomTopics,
        hiddenBuiltIn,setHiddenBuiltIn,
        customWords,setCustomWords,
        activeTopic:topic,setActiveTopic:setTopic,
        gc
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
