<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>French Flashcards</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#2a85e8"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="French Cards"/>
  <link rel="apple-touch-icon" href="icon.png"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#111;padding:1rem;max-width:520px;margin:0 auto}
    button{cursor:pointer;font-family:inherit}
    input,select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid #ddd;border-radius:8px;outline:none;background:#fff;width:100%}
    .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .stat{font-size:12px;color:#666}
    .btns{display:flex;gap:6px;flex-wrap:wrap}
    .btn{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid #ddd;background:#fff;color:#666;font-weight:500}
    .btn.primary{border:none;color:#fff}
    .panel{background:#f8f8f8;border:1px solid #eee;border-radius:16px;padding:14px;margin-bottom:12px}
    .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;font-weight:600}
    .close{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid #ddd;background:#fff;color:#666}
    .field{margin-bottom:10px}
    .label{font-size:11px;color:#888;margin-bottom:4px}
    .topic-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .tp{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid #ddd;background:#fff;color:#666}
    .tp.on{border:none;color:#fff;font-weight:500}
    .skip{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer}
    .tog{width:40px;height:22px;border-radius:999px;background:#ddd;position:relative;flex-shrink:0;transition:background .2s}
    .tog.on{background:#2a85e8}
    .knob{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
    .tog.on .knob{left:21px}
    .prog{height:4px;border-radius:99px;background:#eee;overflow:hidden;margin-bottom:12px}
    .progfill{height:100%;border-radius:99px;transition:width .3s}
    .ctr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:#666}
    .badges{display:flex;gap:6px}
    .bk{background:#e6f9f0;color:#2aae6e;font-size:12px;padding:3px 10px;border-radius:20px}
    .br{background:#fff8e1;color:#e8a82a;font-size:12px;padding:3px 10px;border-radius:20px}
    .card{border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:2rem 1.5rem;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;border:1px solid #eee;background:#fff;user-select:none;margin-bottom:14px}
    .tag{position:absolute;top:10px;left:14px;font-size:11px;padding:2px 8px;border-radius:999px}
    .hint{position:absolute;top:14px;right:16px;font-size:11px;color:#bbb}
    .fr{font-size:36px;font-weight:500;text-align:center;line-height:1.2}
    .pr{font-size:14px;color:#999;font-style:italic}
    .en-sm{font-size:14px;color:#999}
    .en{font-size:30px;font-weight:500;text-align:center;line-height:1.2}
    .speak-row{display:flex;justify-content:center;margin-bottom:12px}
    .speak{padding:8px 26px;border-radius:999px;border:none;background:#e8852a;color:#fff;font-size:22px;transition:transform .1s,background .2s}
    .speak.on{background:#c46a1a;transform:scale(.94)}
    .marks{display:flex;gap:10px;margin-bottom:10px}
    .mk{flex:1;padding:7px 0;font-size:18px;border-radius:12px;border:1px solid #ddd;background:#fff;color:#999;display:flex;align-items:center;justify-content:center}
    .mk.k{background:#e6f9f0;color:#2aae6e;border-color:#2aae6e}
    .mk.r{background:#fff8e1;color:#e8a82a;border-color:#e8a82a}
    .navs{display:flex;gap:10px}
    .nv{flex:1;padding:8px 0;font-size:18px;border-radius:12px;border:1px solid #ddd;background:#fff;color:#333;display:flex;align-items:center;justify-content:center}
    .shuf{padding:8px 18px;font-size:18px;border-radius:12px;border:1px solid #ddd;background:#fff;color:#999}
    .trow{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:#fff;border:1px solid #eee;border-radius:8px;padding:5px 8px}
    .trow span{flex:1;font-size:13px}
    .ib{padding:4px 8px;border-radius:6px;border:1px solid #ddd;background:#fff;font-size:13px}
  </style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useCallback,createElement:e} = React;

const COLORS={"All":"#2a85e8","Everyday":"#e85a2a","Months & Days":"#2aae6e","Numbers":"#9b2ae8","Classroom":"#e8a82a","Adjectives":"#e82a7a","Verbs":"#2ab8e8","Family & Home":"#e86a2a","City & Transport":"#5a8ae8","My Words":"#16a085"};

const BASE=[
  {fr:"bonjour",pr:"bohn-ZHOOR",en:"hello / good day",t:"Everyday"},
  {fr:"merci",pr:"mehr-SEE",en:"thank you",t:"Everyday"},
  {fr:"s'il vous plaît",pr:"seel voo PLEH",en:"please",t:"Everyday"},
  {fr:"au revoir",pr:"oh reh-VWAHR",en:"goodbye",t:"Everyday"},
  {fr:"oui",pr:"WEE",en:"yes",t:"Everyday"},
  {fr:"non",pr:"NOH",en:"no",t:"Everyday"},
  {fr:"l'eau",pr:"LOH",en:"water",t:"Everyday"},
  {fr:"le pain",pr:"leh PAN",en:"bread",t:"Everyday"},
  {fr:"rouge",pr:"ROOZH",en:"red",t:"Everyday"},
  {fr:"bleu",pr:"BLUH",en:"blue",t:"Everyday"},
  {fr:"grand",pr:"GRAHN",en:"big / tall",t:"Everyday"},
  {fr:"petit",pr:"peh-TEE",en:"small",t:"Everyday"},
  {fr:"aujourd'hui",pr:"oh-zhoor-DWEE",en:"today",t:"Everyday"},
  {fr:"demain",pr:"deh-MAN",en:"tomorrow",t:"Everyday"},
  {fr:"le chat",pr:"leh SHA",en:"the cat",t:"Everyday"},
  {fr:"le chien",pr:"leh SHYEN",en:"the dog",t:"Everyday"},
  {fr:"janvier",pr:"zhahn-VYEH",en:"January",t:"Months & Days"},
  {fr:"février",pr:"feh-VRYEH",en:"February",t:"Months & Days"},
  {fr:"mars",pr:"MARS",en:"March",t:"Months & Days"},
  {fr:"avril",pr:"ah-VREEL",en:"April",t:"Months & Days"},
  {fr:"mai",pr:"MEH",en:"May",t:"Months & Days"},
  {fr:"juin",pr:"ZHWAN",en:"June",t:"Months & Days"},
  {fr:"juillet",pr:"zhwee-YEH",en:"July",t:"Months & Days"},
  {fr:"août",pr:"OOT",en:"August",t:"Months & Days"},
  {fr:"septembre",pr:"sep-TAHM-breh",en:"September",t:"Months & Days"},
  {fr:"octobre",pr:"ok-TOH-breh",en:"October",t:"Months & Days"},
  {fr:"novembre",pr:"noh-VAHM-breh",en:"November",t:"Months & Days"},
  {fr:"décembre",pr:"deh-SAHM-breh",en:"December",t:"Months & Days"},
  {fr:"lundi",pr:"lun-DEE",en:"Monday",t:"Months & Days"},
  {fr:"mardi",pr:"mar-DEE",en:"Tuesday",t:"Months & Days"},
  {fr:"mercredi",pr:"mehr-kreh-DEE",en:"Wednesday",t:"Months & Days"},
  {fr:"jeudi",pr:"zhuh-DEE",en:"Thursday",t:"Months & Days"},
  {fr:"vendredi",pr:"vahn-dreh-DEE",en:"Friday",t:"Months & Days"},
  {fr:"samedi",pr:"sahm-DEE",en:"Saturday",t:"Months & Days"},
  {fr:"dimanche",pr:"dee-MAHNSH",en:"Sunday",t:"Months & Days"},
  {fr:"la semaine",pr:"lah seh-MEN",en:"the week",t:"Months & Days"},
  {fr:"le mois",pr:"leh MWAH",en:"the month",t:"Months & Days"},
  {fr:"l'année",pr:"lah-NEH",en:"the year",t:"Months & Days"},
  {fr:"le week-end",pr:"leh wee-KEND",en:"the weekend",t:"Months & Days"},
  {fr:"un",pr:"AN",en:"one (1)",t:"Numbers"},
  {fr:"deux",pr:"DUH",en:"two (2)",t:"Numbers"},
  {fr:"trois",pr:"TWAH",en:"three (3)",t:"Numbers"},
  {fr:"quatre",pr:"KAH-treh",en:"four (4)",t:"Numbers"},
  {fr:"cinq",pr:"SANK",en:"five (5)",t:"Numbers"},
  {fr:"six",pr:"SEES",en:"six (6)",t:"Numbers"},
  {fr:"sept",pr:"SET",en:"seven (7)",t:"Numbers"},
  {fr:"huit",pr:"WEET",en:"eight (8)",t:"Numbers"},
  {fr:"neuf",pr:"NUF",en:"nine (9)",t:"Numbers"},
  {fr:"dix",pr:"DEES",en:"ten (10)",t:"Numbers"},
  {fr:"onze",pr:"ONZ",en:"eleven (11)",t:"Numbers"},
  {fr:"douze",pr:"DOOZ",en:"twelve (12)",t:"Numbers"},
  {fr:"treize",pr:"TREZ",en:"thirteen (13)",t:"Numbers"},
  {fr:"quatorze",pr:"kah-TORZ",en:"fourteen (14)",t:"Numbers"},
  {fr:"quinze",pr:"KANZ",en:"fifteen (15)",t:"Numbers"},
  {fr:"seize",pr:"SEZ",en:"sixteen (16)",t:"Numbers"},
  {fr:"dix-sept",pr:"dee-SET",en:"seventeen (17)",t:"Numbers"},
  {fr:"dix-huit",pr:"dee-WEET",en:"eighteen (18)",t:"Numbers"},
  {fr:"dix-neuf",pr:"dee-NUF",en:"nineteen (19)",t:"Numbers"},
  {fr:"vingt",pr:"VAN",en:"twenty (20)",t:"Numbers"},
  {fr:"trente",pr:"TRONT",en:"thirty (30)",t:"Numbers"},
  {fr:"quarante",pr:"kah-RONT",en:"forty (40)",t:"Numbers"},
  {fr:"cinquante",pr:"san-KONT",en:"fifty (50)",t:"Numbers"},
  {fr:"soixante",pr:"swah-SONT",en:"sixty (60)",t:"Numbers"},
  {fr:"soixante-dix",pr:"swah-sont-DEES",en:"seventy (70)",t:"Numbers"},
  {fr:"quatre-vingts",pr:"kah-treh-VAN",en:"eighty (80)",t:"Numbers"},
  {fr:"quatre-vingt-dix",pr:"kah-treh-van-DEES",en:"ninety (90)",t:"Numbers"},
  {fr:"cent",pr:"SON",en:"one hundred (100)",t:"Numbers"},
  {fr:"je ne comprends pas",pr:"zheh neh kom-PRON pah",en:"I don't understand",t:"Classroom"},
  {fr:"répétez s'il vous plaît",pr:"ray-pay-TAY seel voo PLEH",en:"repeat please",t:"Classroom"},
  {fr:"l'élève",pr:"lay-LEV",en:"the student",t:"Classroom"},
  {fr:"le professeur",pr:"leh pro-feh-SUR",en:"the teacher",t:"Classroom"},
  {fr:"l'école",pr:"lay-KOL",en:"the school",t:"Classroom"},
  {fr:"le livre",pr:"leh LEE-vreh",en:"the book",t:"Classroom"},
  {fr:"manger",pr:"mahn-ZHEH",en:"to eat",t:"Verbs"},
  {fr:"parler",pr:"par-LEH",en:"to speak",t:"Verbs"},
  {fr:"aller",pr:"ah-LEH",en:"to go",t:"Verbs"},
  {fr:"avoir",pr:"ah-VWAHR",en:"to have",t:"Verbs"},
  {fr:"être",pr:"EH-treh",en:"to be",t:"Verbs"},
  {fr:"aimer",pr:"ay-MAY",en:"to like / love",t:"Verbs"},
  {fr:"écouter",pr:"ay-koo-TAY",en:"to listen",t:"Verbs"},
  {fr:"lire",pr:"LEER",en:"to read",t:"Verbs"},
  {fr:"la famille",pr:"lah fah-MEE",en:"the family",t:"Family & Home"},
  {fr:"la mère",pr:"lah MEHR",en:"the mother",t:"Family & Home"},
  {fr:"le père",pr:"leh PEHR",en:"the father",t:"Family & Home"},
  {fr:"le frère",pr:"leh FREHR",en:"the brother",t:"Family & Home"},
  {fr:"la sœur",pr:"lah SUR",en:"the sister",t:"Family & Home"},
  {fr:"la maison",pr:"lah meh-ZON",en:"the house",t:"Family & Home"},
  {fr:"la chambre",pr:"lah SHOM-breh",en:"the bedroom",t:"Family & Home"},
  {fr:"le métro",pr:"leh may-TRO",en:"the subway",t:"City & Transport"},
  {fr:"la voiture",pr:"lah vwah-TYUR",en:"the car",t:"City & Transport"},
  {fr:"la rue",pr:"lah RYU",en:"the street",t:"City & Transport"},
  {fr:"le musée",pr:"leh myoo-ZAY",en:"the museum",t:"City & Transport"},
  {fr:"la pharmacie",pr:"lah far-mah-SEE",en:"the pharmacy",t:"City & Transport"},
  {fr:"la poste",pr:"lah POST",en:"the post office",t:"City & Transport"},
];

const ls=(k,d="")=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const lsj=(k,d)=>{try{return JSON.parse(ls(k,JSON.stringify(d)))}catch(e){return d}};
const lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const mkDeck=(topic,skip,known,cards)=>{
  let f=topic==="All"?cards:cards.filter(c=>c.t===topic);
  if(skip)f=f.filter(c=>!known.has(c.fr));
  return f.length?f:(topic==="All"?cards:cards.filter(c=>c.t===topic));
};

function App(){
  const [cards,setCards]=useState(()=>{const w=lsj("fr-words",[]);return w.length?[...BASE,...w]:BASE});
  const [customTopics,setCustomTopics]=useState(()=>lsj("fr-topics",[]));
  const [known,setKnown]=useState(()=>new Set(lsj("fr-known",[])));
  const [review,setReview]=useState(()=>new Set(lsj("fr-review",[])));
  const [topic,setTopic]=useState("All");
  const [skip,setSkip]=useState(false);
  const [deck,setDeck]=useState(()=>mkDeck("All",false,new Set(),BASE));
  const [idx,setIdx]=useState(0);
  const [flip,setFlip]=useState(false);
  const [spk,setSpk]=useState(false);
  // panels
  const [panel,setPanel]=useState(null); // "add"|"sheet"|"topics"|null
  // add word
  const [nFr,setNFr]=useState("");const [nPr,setNPr]=useState("");const [nEn,setNEn]=useState("");const [nT,setNT]=useState("Everyday");const [msg,setMsg]=useState("");
  // sheet
  const [sUrl,setSUrl]=useState(()=>ls("fr-sheet-url",""));const [sSt,setSSt]=useState("idle");const [sErr,setSErr]=useState("");
  // topic manager
  const [editT,setEditT]=useState(null);const [editN,setEditN]=useState("");const [newTN,setNewTN]=useState("");

  const color=COLORS[topic]||"#2a85e8";
  const hiddenTopics=lsj("fr-hidden-topics",[]);
  const allBuiltin=Object.keys(COLORS).filter(k=>k!=="All"&&!hiddenTopics.includes(k));
  const allCustom=customTopics.filter(t=>!Object.keys(COLORS).includes(t)&&!hiddenTopics.includes(t));
  const allTopics=["All",...allBuiltin,...allCustom];
  const allManage=[...allBuiltin,...allCustom];
  const card=deck[idx];
  const isK=known.has(card.fr);
  const isR=review.has(card.fr);
  const prog=Math.round(((known.size+review.size)/deck.length)*100);

  const go=(d)=>{setFlip(false);setIdx(i=>(i+d+deck.length)%deck.length)};
  const chgTopic=(t)=>{
    const newDeck=mkDeck(t,skip,known,cards);
    if(newDeck.length===0){alert(`No cards in "${t}" yet!`);return;}
    setTopic(t);setDeck(newDeck);setIdx(0);setFlip(false);
  };
  const togSkip=()=>{const n=!skip;setSkip(n);setDeck(mkDeck(topic,n,known,cards));setIdx(0);setFlip(false)};
  const mark=(type)=>{
    const id=card.fr;
    setKnown(s=>{const n=new Set(s);type==="k"?n.add(id):n.delete(id);return n});
    setReview(s=>{const n=new Set(s);type==="r"?n.add(id):n.delete(id);return n});
  };
  const save=()=>{lss("fr-known",[...known]);lss("fr-review",[...review]);alert("Saved ✓")};
  const reset=()=>{if(!confirm("Reset all progress?"))return;setKnown(new Set());setReview(new Set());lss("fr-known",[]);lss("fr-review",[])};

  const speak=useCallback(()=>{
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(card.fr);u.lang="fr-FR";u.rate=0.85;
    setSpk(true);u.onend=()=>setSpk(false);u.onerror=()=>setSpk(false);
    window.speechSynthesis.speak(u);
  },[card]);

  const addWord=()=>{
    if(!nFr.trim()||!nEn.trim()){setMsg("⚠️ French & English required!");return}
    const w={fr:nFr.trim(),pr:nPr.trim(),en:nEn.trim(),t:nT||"My Words"};
    const updated=[...cards,w];setCards(updated);
    setDeck(mkDeck(topic,skip,known,updated));
    const saved=lsj("fr-words",[]);lss("fr-words",[...saved,w]);
    setNFr("");setNPr("");setNEn("");setMsg("✅ Added!");setTimeout(()=>setMsg(""),2000);
  };

  const fetchSheet=async(url)=>{
    setSSt("loading");setSErr("");
    try{
      if(!url.includes("google.com"))throw new Error("Invalid URL");
      let csv=url.includes("pub?output=csv")?url:(()=>{
        const m=url.match(/\/d\/e\/([\w-]+)/)||url.match(/\/d\/([\w-]+)/);
        if(!m)throw new Error("Cannot read sheet ID");
        return url.includes("/d/e/")?`https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?output=csv`:`https://docs.google.com/spreadsheets/d/${m[1]}/pub?output=csv`;
      })();
      let text=null;
      for(const p of[csv,`https://api.allorigins.win/raw?url=${encodeURIComponent(csv)}`,`https://corsproxy.io/?${encodeURIComponent(csv)}`]){
        try{const r=await fetch(p);if(r.ok){text=await r.text();break}}catch(e){}
      }
      if(!text)throw new Error("Could not connect. Publish sheet: File → Share → Publish to web → CSV");
      const rows=text.trim().split("\n").slice(1);
      const nc=rows.map(row=>{const c=(row.match(/(".*?"|[^,]+)(?=,|$)/g)||[]).map(x=>x.replace(/^"|"$/g,"").trim());return{fr:c[0]||"",pr:c[1]||"",en:c[2]||"",t:c[3]||"My Words"}}).filter(c=>c.fr&&c.en);
      if(!nc.length)throw new Error("No cards found. Check columns: French, Pronunciation, English, Topic");
      const combined=[...BASE,...nc];setCards(combined);setDeck(mkDeck(topic,skip,known,combined));setIdx(0);setFlip(false);setSSt("success");
      localStorage.setItem("fr-sheet-url",url);
    }catch(e){setSSt("error");setSErr(e.message)}
  };

  const saveTopics=(t)=>{setCustomTopics(t);lss("fr-topics",t)};
  const addTopic=()=>{const n=newTN.trim();if(!n||allTopics.includes(n))return;saveTopics([...customTopics,n]);setNewTN("")};
  const renameTopic=(old,nw)=>{
    const tr=nw.trim();if(!tr||tr===old){setEditT(null);return}
    const uc=cards.map(c=>c.t===old?{...c,t:tr}:c);setCards(uc);setDeck(mkDeck(topic,skip,known,uc));
    saveTopics(customTopics.map(t=>t===old?tr:t));
    if(topic===old)setTopic(tr);setEditT(null);
  };
  const deleteTopic=(name)=>{
    if(!confirm(`Delete "${name}"? Cards will move to My Words.`))return;
    // Move all cards with this topic to My Words
    const uc=cards.map(c=>c.t===name?{...c,t:"My Words"}:c);
    setCards(uc);
    setDeck(mkDeck(topic==="All"?"All":topic===name?"All":topic,skip,known,uc));
    // Remove from custom topics if it's custom
    const updatedCustom=customTopics.filter(t=>t!==name);
    setCustomTopics(updatedCustom);
    lss("fr-topics",updatedCustom);
    // Also remove from built-in display by adding to a "hidden" list
    const hidden=lsj("fr-hidden-topics",[]);
    if(!hidden.includes(name)){
      const updatedHidden=[...hidden,name];
      lss("fr-hidden-topics",updatedHidden);
    }
    if(topic===name)setTopic("All");
  };

  const togPanel=(p)=>setPanel(prev=>prev===p?null:p);

  return e("div",null,
    // Top bar
    e("div",{className:"topbar"},
      e("div",{className:"stat"},
        e("span",{style:{color:"#2aae6e",fontWeight:500}},known.size+" ✓"),
        " / ",e("span",{style:{color:"#e8a82a",fontWeight:500}},review.size+" ↺"),
        " / ",e("span",{style:{fontWeight:500}},cards.length+" total")
      ),
      e("div",{className:"btns"},
        e("button",{className:"btn"+(panel==="add"?" primary":""),style:panel==="add"?{background:color,border:"none",color:"#fff"}:{},onClick:()=>togPanel("add")},"➕ Add Word"),
        e("button",{className:"btn",style:{background:sSt==="success"?"#e8f9f0":"#fff",color:sSt==="success"?"#16a085":"#666"},onClick:()=>togPanel("sheet")},"📊 "+(sSt==="success"?"Connected":"Sheet")),
        e("button",{className:"btn primary",style:{background:color,border:"none",color:"#fff"},onClick:save},"Save"),
        e("button",{className:"btn",onClick:reset},"Reset"),
      )
    ),

    // Add Word panel
    panel==="add"&&e("div",{className:"panel"},
      e("div",{className:"panel-head"},"➕ Add New Word",e("button",{className:"close",onClick:()=>setPanel(null)},"✕ Close")),
      e("div",{className:"field"},e("div",{className:"label"},"🇫🇷 French *"),e("input",{value:nFr,onChange:ev=>setNFr(ev.target.value),placeholder:"e.g. la mer"})),
      e("div",{className:"field"},e("div",{className:"label"},"🔊 Pronunciation (optional)"),e("input",{value:nPr,onChange:ev=>setNPr(ev.target.value),placeholder:"e.g. lah MEHR"})),
      e("div",{className:"field"},e("div",{className:"label"},"🇬🇧 English *"),e("input",{value:nEn,onChange:ev=>setNEn(ev.target.value),placeholder:"e.g. the sea"})),
      e("div",{className:"field"},
        e("div",{className:"label"},"📁 Topic"),
        e("select",{value:nT,onChange:ev=>setNT(ev.target.value)},
          allTopics.filter(t=>t!=="All").map(t=>e("option",{key:t,value:t},t))
        )
      ),
      e("button",{onClick:addWord,style:{width:"100%",padding:"10px",borderRadius:12,border:"none",background:color,color:"#fff",fontSize:14,fontWeight:500}},"➕ Add Card"),
      msg&&e("div",{style:{marginTop:8,fontSize:13,textAlign:"center",color:msg.includes("✅")?"#2aae6e":"#e85a2a"}},msg)
    ),

    // Sheet panel
    panel==="sheet"&&e("div",{className:"panel"},
      e("div",{className:"panel-head"},"📊 Connect Google Sheet",e("button",{className:"close",onClick:()=>setPanel(null)},"✕ Close")),
      e("p",{style:{fontSize:12,color:"#777",lineHeight:1.7,marginBottom:10}},
        "1. Sheet columns: French | Pronunciation | English | Topic",e("br"),
        "2. File → Share → Publish to web → CSV → Publish",e("br"),
        "3. Paste the published link below"
      ),
      e("div",{style:{display:"flex",gap:8,marginBottom:8}},
        e("input",{value:sUrl,onChange:ev=>setSUrl(ev.target.value),placeholder:"https://docs.google.com/spreadsheets/d/...",style:{flex:1}}),
        e("button",{onClick:()=>fetchSheet(sUrl),disabled:!sUrl||sSt==="loading",style:{padding:"7px 14px",borderRadius:8,border:"none",background:color,color:"#fff",fontWeight:500,whiteSpace:"nowrap",opacity:!sUrl||sSt==="loading"?0.5:1}},sSt==="loading"?"...":"Load")
      ),
      sSt==="success"&&e("div",{style:{fontSize:12,color:"#16a085"}},"✅ Sheet loaded!"),
      sSt==="error"&&e("div",{style:{fontSize:12,color:"#e85a2a"}},"⚠️ "+sErr)
    ),

    // Topic header + manage button
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
      e("div",{style:{fontSize:12,color:"#888"}},"topic"),
      e("button",{className:"btn"+(panel==="topics"?" primary":""),style:panel==="topics"?{background:color,border:"none",color:"#fff"}:{},onClick:()=>togPanel("topics")},"⚙️ Manage")
    ),

    // Topic pills — only show topics that have cards, plus All
    e("div",{className:"topic-pills"},
      allTopics.filter(t=>{
        if(t==="All") return true;
        return cards.some(c=>c.t===t);
      }).map(t=>e("button",{key:t,className:"tp"+(topic===t?" on":""),style:topic===t?{background:COLORS[t]||"#2a85e8"}:{},onClick:()=>chgTopic(t)},t))
    ),

    // Topics manager panel
    panel==="topics"&&e("div",{className:"panel"},
      e("div",{className:"panel-head"},"⚙️ Manage Topics",e("button",{className:"close",onClick:()=>setPanel(null)},"✕ Close")),
      allManage.map(t=>e("div",{key:t,className:"trow"},
        editT===t
          ?e(React.Fragment,null,
              e("input",{value:editN,onChange:ev=>setEditN(ev.target.value),onKeyDown:ev=>ev.key==="Enter"&&renameTopic(t,editN),autoFocus:true,style:{flex:1}}),
              e("button",{onClick:()=>renameTopic(t,editN),style:{padding:"4px 10px",borderRadius:6,border:"none",background:color,color:"#fff"}},"✓"),
              e("button",{onClick:()=>setEditT(null),style:{padding:"4px 10px",borderRadius:6,border:"1px solid #ddd",background:"#fff",color:"#666"}},"✕")
            )
          :e(React.Fragment,null,
              e("span",null,t),
              e("button",{className:"ib",onClick:()=>{setEditT(t);setEditN(t)}},"✏️"),
              e("button",{className:"ib",style:{color:"#e85a2a"},onClick:()=>deleteTopic(t)},"🗑️")
            )
      )),
      e("div",{style:{display:"flex",gap:8,marginTop:10}},
        e("input",{value:newTN,onChange:ev=>setNewTN(ev.target.value),onKeyDown:ev=>ev.key==="Enter"&&addTopic(),placeholder:"New topic name...",style:{flex:1}}),
        e("button",{onClick:addTopic,disabled:!newTN.trim(),style:{padding:"7px 14px",borderRadius:8,border:"none",background:color,color:"#fff",opacity:newTN.trim()?1:0.5}},"➕ Add")
      )
    ),

    // Skip toggle
    e("div",{className:"skip",onClick:togSkip},
      e("div",{className:"tog"+(skip?" on":""),style:skip?{background:color}:{}},e("div",{className:"knob"})),
      e("span",{style:{fontSize:13,color:"#666"}},
        "Skip words I know",
        skip&&e("span",{style:{color,fontWeight:500,marginLeft:6}},"("+deck.length+" left)")
      )
    ),

    // Counter
    e("div",{className:"ctr"},
      e("span",null,"Card "+(idx+1)+" of "+deck.length),
      e("div",{className:"badges"},e("span",{className:"bk"},known.size+" ✓"),e("span",{className:"br"},review.size+" ↺"))
    ),

    // Progress
    e("div",{className:"prog"},e("div",{className:"progfill",style:{width:prog+"%",background:color}})),

    // Card
    e("div",{className:"card",style:{border:`1px solid ${isK?"#2aae6e":isR?"#e8a82a":"#eee"}`},onClick:()=>setFlip(f=>!f)},
      e("span",{className:"tag",style:{background:(COLORS[card.t]||"#2a85e8")+"22",color:COLORS[card.t]||"#2a85e8"}},card.t),
      e("span",{className:"hint"},flip?"meaning":"tap to reveal"),
      !flip
        ?e(React.Fragment,null,e("div",{className:"fr"},card.fr),e("div",{className:"pr"},card.pr))
        :e(React.Fragment,null,e("div",{className:"en-sm"},card.fr),e("div",{className:"en"},card.en))
    ),

    // Speaker
    e("div",{className:"speak-row"},
      e("button",{className:"speak"+(spk?" on":""),onClick:speak},"🔊")
    ),

    // Mark buttons
    e("div",{className:"marks"},
      e("button",{className:"mk"+(isK?" k":""),onClick:()=>mark(isK?null:"k")},"✓"),
      e("button",{className:"mk"+(isR?" r":""),onClick:()=>mark(isR?null:"r")},"↺")
    ),

    // Nav
    e("div",{className:"navs"},
      e("button",{className:"nv",onClick:()=>go(-1)},"←"),
      e("button",{className:"shuf",onClick:()=>{setDeck(d=>shuf(d));setIdx(0);setFlip(false)}},"⇄"),
      e("button",{className:"nv",onClick:()=>go(1)},"→")
    )
  );
}

ReactDOM.render(e(App),document.getElementById("app"));
</script>
</body>
</html>
